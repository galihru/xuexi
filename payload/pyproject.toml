[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xuexi-kakeya-agent"
version = "2.3.0"
description = "基于本地代码模型的三维 Kakeya 数值研究与自我审查代理。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "plotly>=6.0",
  "matplotlib>=3.9",
  "pillow>=10.0",
  "imageio-ffmpeg>=0.5.1",
  "PyYAML>=6.0",
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
research = ["huggingface_hub>=0.30"]

[project.scripts]
kakeya-sim = "kakeya_sim.cli:main"
xuexi-agent = "xuexi_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
