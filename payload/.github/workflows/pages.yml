name: 学习 · 自动启用并发布三维研究网站

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 创建可启用 Pages 的 Xuexi token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.XUEXI_CLIENT_ID || secrets.XUEXI_CLIENT_ID }}
          private-key: ${{ secrets.XUEXI_PRIVATE_KEY }}
          owner: galihru
          repositories: KakeyaSetConjecture
          permission-administration: write
          permission-pages: write

      - name: 检查网站结构
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "site/index.html"
            "site/viewer.html"
            "site/preview.png"
            "site/rotation.mp4"
            "site/rotation.gif"
            "site/metrics.json"
          )
          for file in "${required_files[@]}"; do
            [[ -s "$file" ]] || { echo "::error::缺少或为空：$file"; exit 1; }
            echo "✓ $file"
          done
          touch site/.nojekyll

      - name: 自动启用并配置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          enablement: true

      - name: 上传网站产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 自动部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
