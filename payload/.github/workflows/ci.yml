name: 学习 · 确定性测试与快速渲染

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "artifacts/**"
      - "site/**"
      - "state/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -e ".[dev,research]"
      - name: 重建论文公式索引
        run: python -m xuexi_agent index-paper --paper paper/2502.17655v1.pdf --output knowledge/equations.json
      - name: 运行测试
        run: python -m pytest -q
      - name: 快速渲染
        run: |
          python -m kakeya_sim \
            --mode mixed --seed 250217655 --tubes 18 \
            --delta 0.065 --rho 0.26 --resolution 20 \
            --frames 8 --fps 8 \
            --output .ci/artifacts --site-output .ci/site
