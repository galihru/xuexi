name: 学习 · 重建并发布 Kakeya 研究代理

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: 目标仓库名称
        required: true
        default: KakeyaSetConjecture
        type: string
      reset_history:
        description: 是否重建 main 历史（确保默认分支只保留机器人提交）
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: xuexi-bootstrap-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 以 Xuexi GitHub App 身份发布
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出 xuexi 引导仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 检查引导目录结构
        shell: bash
        run: |
          set -euo pipefail
          test -f payload/pyproject.toml
          test -f payload/paper/2502.17655v1.pdf
          test -f payload/.github/workflows/agent-cycle.yml
          test -f payload/src/xuexi_agent/agent.py
          echo "引导内容检查通过。"

      - name: 创建 Xuexi installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.XUEXI_CLIENT_ID || secrets.XUEXI_CLIENT_ID }}
          private-key: ${{ secrets.XUEXI_PRIVATE_KEY }}
          owner: galihru
          repositories: ${{ inputs.target_repository }}
          permission-contents: write
          permission-workflows: write

      - name: 验证 GitHub App 安装与仓库访问
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ inputs.target_repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo view "galihru/${TARGET}" --json nameWithOwner,defaultBranchRef
          gh api "/repos/galihru/${TARGET}/installation" --jq '.app_slug'

      - name: 安装并测试待发布项目
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -e "./payload[dev,research]"
          python -m pytest -q payload/tests
          rm -rf payload/artifacts/latest payload/site
          python -m kakeya_sim \
            --mode mixed \
            --seed 250217655 \
            --tubes 24 \
            --delta 0.06 \
            --rho 0.25 \
            --resolution 24 \
            --frames 12 \
            --fps 8 \
            --output payload/artifacts/latest \
            --site-output payload/site

      - name: 获取机器人提交身份
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          BOT_LOGIN="${{ steps.app-token.outputs.app-slug }}[bot]"
          BOT_ID="$(gh api "/users/${BOT_LOGIN}" --jq '.id')"
          echo "login=${BOT_LOGIN}" >> "$GITHUB_OUTPUT"
          echo "id=${BOT_ID}" >> "$GITHUB_OUTPUT"

      - name: 同步并提交目标仓库
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ inputs.target_repository }}
          RESET_HISTORY: ${{ inputs.reset_history }}
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
          BOT_ID: ${{ steps.bot.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git

          rm -rf target
          mkdir target
          cd target
          git init
          git remote add origin "https://github.com/galihru/${TARGET}.git"
          git config user.name "$BOT_LOGIN"
          git config user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"

          if [[ "$RESET_HISTORY" == "true" ]]; then
            git checkout --orphan xuexi-rebuild
          elif git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch --depth=1 origin main
            git checkout -B main origin/main
          else
            git checkout -b main
          fi

          rsync -a --delete --exclude='.git/' ../payload/ ./
          rm -rf .pytest_cache '**/__pycache__' 2>/dev/null || true
          git add --all

          if git diff --cached --quiet; then
            echo "目标仓库已经与新版本一致。"
            exit 0
          fi

          git commit -m "重建：初始化学习自主研究代理 [xuexi-cycle]"

          if [[ "$RESET_HISTORY" == "true" ]]; then
            git branch -M main
            git push --force origin main
          else
            git push origin main
          fi
