name: 学习 · 自动同步并发布 Kakeya 研究代理

on:
  push:
    branches: [main]
    paths:
      - "payload/**"
      - ".github/workflows/xuexi.yml"
  workflow_dispatch:
    inputs:
      target_repository:
        description: 目标仓库名称
        required: true
        default: KakeyaSetConjecture
        type: string
      reset_history:
        description: 是否重建 main 历史
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: xuexi-bootstrap-publish
  cancel-in-progress: true

jobs:
  publish:
    name: 以 Xuexi GitHub App 身份自动发布
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出 xuexi 引导仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 解析自动发布参数
        id: settings
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.target_repository }}"
            RESET="${{ inputs.reset_history }}"
          else
            TARGET="KakeyaSetConjecture"
            RESET="false"
          fi

          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "reset=${RESET}" >> "$GITHUB_OUTPUT"
          echo "目标仓库：galihru/${TARGET}"
          echo "重建历史：${RESET}"

      - name: 查找并检查引导目录结构
        id: layout
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD_DIR=""

          if [[ -f "payload/pyproject.toml" ]]; then
            PAYLOAD_DIR="payload"
          else
            mapfile -t CANDIDATES < <(
              find . -type f -path '*/payload/pyproject.toml'                 -not -path './.git/*' -printf '%h\n' | sort -u
            )

            if [[ ${#CANDIDATES[@]} -eq 1 ]]; then
              PAYLOAD_DIR="${CANDIDATES[0]#./}"
            elif [[ ${#CANDIDATES[@]} -eq 0 ]]; then
              echo "::error::找不到 payload/pyproject.toml。请先解压 ZIP，再上传 .github 和 payload。"
              exit 1
            else
              echo "::error::检测到多个 payload 目录："
              printf ' - %s\n' "${CANDIDATES[@]}"
              exit 1
            fi
          fi

          REQUIRED_FILES=(
            "pyproject.toml"
            "paper/2502.17655v1.pdf"
            ".github/workflows/agent-cycle.yml"
            ".github/workflows/ci.yml"
            ".github/workflows/pages.yml"
            "src/xuexi_agent/agent.py"
            "src/kakeya_sim/cli.py"
            "src/kakeya_sim/media.py"
          )

          MISSING=0
          for relative_path in "${REQUIRED_FILES[@]}"; do
            full_path="${PAYLOAD_DIR}/${relative_path}"
            if [[ -s "${full_path}" ]]; then
              echo "✓ ${full_path}"
            else
              echo "::error file=${full_path}::缺少或为空：${full_path}"
              MISSING=1
            fi
          done

          [[ ${MISSING} -eq 0 ]] || exit 1
          echo "payload_dir=${PAYLOAD_DIR}" >> "$GITHUB_OUTPUT"

      - name: 检查 Xuexi 凭据
        env:
          CLIENT_ID: ${{ vars.XUEXI_CLIENT_ID || secrets.XUEXI_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.XUEXI_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLIENT_ID" ]] || { echo "::error::缺少 XUEXI_CLIENT_ID。"; exit 1; }
          [[ -n "$PRIVATE_KEY" ]] || { echo "::error::缺少 XUEXI_PRIVATE_KEY。"; exit 1; }
          grep -q -- 'BEGIN .*PRIVATE KEY' <<< "$PRIVATE_KEY" || {
            echo "::error::XUEXI_PRIVATE_KEY 不是完整 PEM 私钥。"
            exit 1
          }

      - name: 创建 Xuexi installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.XUEXI_CLIENT_ID || secrets.XUEXI_CLIENT_ID }}
          private-key: ${{ secrets.XUEXI_PRIVATE_KEY }}
          owner: galihru
          repositories: ${{ steps.settings.outputs.target }}
          permission-contents: write
          permission-workflows: write

      - name: 安装系统依赖并验证项目
        env:
          PAYLOAD_DIR: ${{ steps.layout.outputs.payload_dir }}
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fontconfig
          fc-cache -f
          command -v ffmpeg
          ffmpeg -version | head -n 1
          fc-match "Noto Sans CJK JP"

          python -m pip install --upgrade pip
          pushd "$PAYLOAD_DIR" >/dev/null
          python -m pip install -e ".[dev,research]"
          python -m pytest -q

          rm -rf artifacts/latest site
          python -m kakeya_sim             --mode mixed --seed 250217655 --tubes 24             --delta 0.06 --rho 0.25 --resolution 24             --frames 12 --fps 8             --output artifacts/latest --site-output site

          test -s artifacts/latest/preview.png
          test -s artifacts/latest/rotation.mp4
          test -s artifacts/latest/rotation.gif
          test -s artifacts/latest/viewer.html
          test -s site/index.html
          popd >/dev/null

      - name: 获取机器人提交身份
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          BOT_LOGIN="${{ steps.app-token.outputs.app-slug }}[bot]"
          BOT_ID="$(gh api "/users/${BOT_LOGIN}" --jq '.id')"
          echo "login=${BOT_LOGIN}" >> "$GITHUB_OUTPUT"
          echo "id=${BOT_ID}" >> "$GITHUB_OUTPUT"

      - name: 自动同步到目标仓库
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ steps.settings.outputs.target }}
          RESET_HISTORY: ${{ steps.settings.outputs.reset }}
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
          BOT_ID: ${{ steps.bot.outputs.id }}
          PAYLOAD_DIR: ${{ steps.layout.outputs.payload_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git

          rm -rf target
          mkdir target
          cd target
          git init
          git remote add origin "https://github.com/galihru/${TARGET}.git"
          git config user.name "$BOT_LOGIN"
          git config user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"

          if [[ "$RESET_HISTORY" == "true" ]]; then
            git checkout --orphan xuexi-rebuild
          elif git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch --depth=1 origin main
            git checkout -B main origin/main
          else
            git checkout -b main
          fi

          rsync -a --delete --exclude='.git/' "$GITHUB_WORKSPACE/${PAYLOAD_DIR}/" ./
          find . -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache

          git add --all
          if git diff --cached --quiet; then
            echo "目标仓库已是最新版本。"
            exit 0
          fi

          git commit -m "同步：发布学习自主研究代理 [xuexi-bootstrap]"

          if [[ "$RESET_HISTORY" == "true" ]]; then
            git branch -M main
            git push --force origin main
          else
            git push origin main
          fi
