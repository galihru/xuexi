name: 学习 · Publish Kakeya Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create Xuexi installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.XUEXI_CLIENT_ID || secrets.XUEXI_CLIENT_ID }}
          private-key: ${{ secrets.XUEXI_PRIVATE_KEY }}
          owner: galihru
          repositories: KakeyaSetConjecture
          permission-contents: write
          permission-workflows: write

      - name: Confirm target repository is empty
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS -o /tmp/commits.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/galihru/KakeyaSetConjecture/commits)"
          if [[ "$HTTP_CODE" == "200" ]]; then
            COUNT="$(jq 'length' /tmp/commits.json)"
            if [[ "$COUNT" != "0" ]]; then
              echo "::error::Target repository already contains commits."
              exit 1
            fi
          elif [[ "$HTTP_CODE" != "409" ]]; then
            cat /tmp/commits.json
            echo "::error::Unexpected GitHub response: HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Resolve Xuexi bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BOT_LOGIN="${{ steps.app-token.outputs.app-slug }}[bot]"
          BOT_ID="$(gh api "/users/${BOT_LOGIN}" --jq '.id')"
          echo "login=${BOT_LOGIN}" >> "$GITHUB_OUTPUT"
          echo "id=${BOT_ID}" >> "$GITHUB_OUTPUT"

      - name: Validate payload
        run: |
          python -m pip install -e payload[dev]
          python -m pytest -q payload/tests
          python -m kakeya_sim \
            --mode mixed --seed 250217655 --tubes 32 \
            --delta 0.065 --rho 0.25 --resolution 32 \
            --output payload/artifacts/sample

      - name: Commit and push complete project as Xuexi bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
          BOT_ID: ${{ steps.bot.outputs.id }}
        run: |
          set -euo pipefail
          gh auth setup-git
          cd payload
          git init --initial-branch=main
          git config user.name "$BOT_LOGIN"
          git config user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"
          git add --all
          git commit -m "feat: initialize Kakeya 3D simulator"
          git remote add origin https://github.com/galihru/KakeyaSetConjecture.git
          git push --set-upstream origin main
